$schema: "./cache/schemas/workspace.json"

projects:
  globs:
    - "apps/*"
    - "packages/*"
  sources:
    root: "."

vcs:
  client: "git"
  defaultBranch: "main"
  hooks:
    pre-commit:
      - "moon run :lint --affected --status=staged"
    pre-merge:
      - "moon run :test"
